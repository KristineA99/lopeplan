# Publiserer en nettversjon av appen på GitHub Pages hver gang du pusher til main.
# Demoen blir liggende på https://<brukernavn>.github.io/lopeplan/
name: Publiser demo

on:
  push:
    branches: [main]
  workflow_dispatch: # gjør det mulig å starte manuelt fra Actions-fanen

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer pakker
        run: npm ci

      - name: Bygg nettversjon
        run: npx expo export --platform web

      # GitHub Pages viser 404.html når noen åpner en underside direkte.
      # Ved å kopiere index.html dit, virker alle lenker i appen.
      - name: Gjør lenker til undersider klare
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
